<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — GospelGoLive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep: #060c1f;
  --panel: #122548;
  --border-soft: rgba(255,255,255,0.08);
  --gold: #e8b84b;
  --gold-soft: #f5d787;
  --gold-dim: rgba(232,184,75,0.14);
  --text: #eef1f8;
  --text-dim: #a6b0cc;
  --text-faint: #6b7593;
  --red: #e05a5a;
  --teal: #3fa39b;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg-deep); color:var(--text); font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{
  width:100%; max-width:420px; background:var(--panel); border:1px solid var(--border-soft);
  border-radius:24px; padding:38px 34px;
}
h1{font-family:'Fraunces',serif; font-size:24px; margin-bottom:6px;}
p.sub{color:var(--text-faint); font-size:13.5px; margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:500;}
.field input{
  width:100%; background:var(--bg-deep); border:1px solid var(--border-soft); border-radius:10px;
  padding:11px 14px; color:var(--text); font-size:14px; outline:none;
}
.field input:focus{border-color:var(--gold);}
.btn{
  width:100%; padding:12px; border-radius:999px; border:none; font-weight:600; font-size:14.5px;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#20160a; cursor:pointer;
}
.btn:disabled{opacity:0.6; cursor:default;}
.msg{font-size:13px; margin-bottom:14px; display:none;}
.msg.error{color:var(--red);}
.msg.success{color:var(--teal);}
.foot{text-align:center; margin-top:20px; font-size:13px; color:var(--text-faint);}
.foot a{color:var(--gold-soft); font-weight:600; text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div id="formState">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your GospelGoLive account.</p>
      <div class="field"><label>New password</label><input type="password" id="newPassword" placeholder="••••••••" minlength="8"></div>
      <div class="field"><label>Confirm password</label><input type="password" id="confirmPassword" placeholder="••••••••" minlength="8"></div>
      <div class="msg error" id="errorMsg"></div>
      <button class="btn" id="submitBtn" onclick="handleReset()">Reset Password</button>
    </div>
    <div id="successState" style="display:none; text-align:center;">
      <h1>Password updated</h1>
      <p class="sub">Your password has been reset. You can sign in with it now.</p>
      <a class="btn" style="display:block; text-align:center; text-decoration:none;" href="/mockup.html">Back to Sign In</a>
    </div>
    <div class="foot" id="footLink"><a href="/mockup.html">Back to GospelGoLive</a></div>
  </div>

<script>
function getToken(){
  return new URLSearchParams(window.location.search).get('token');
}

async function handleReset(){
  const errorEl = document.getElementById('errorMsg');
  errorEl.style.display = 'none';

  const token = getToken();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if(!token){
    errorEl.textContent = 'This reset link is missing its token.';
    errorEl.style.display = 'block';
    return;
  }
  if(newPassword.length < 8){
    errorEl.textContent = 'Password must be at least 8 characters.';
    errorEl.style.display = 'block';
    return;
  }
  if(newPassword !== confirmPassword){
    errorEl.textContent = "Passwords don't match.";
    errorEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Resetting…';

  try {
    const res = await fetch('/api/auth/password-reset/confirm', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({token, newPassword}),
    });
    const data = await res.json();
    if(!res.ok){
      errorEl.textContent = data.error || 'Something went wrong. Please try again.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      return;
    }
    document.getElementById('formState').style.display = 'none';
    document.getElementById('footLink').style.display = 'none';
    document.getElementById('successState').style.display = 'block';
  } catch(err){
    errorEl.textContent = 'Could not reach the server. Please try again.';
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}

if(!getToken()){
  document.getElementById('errorMsg').textContent = 'This reset link is missing its token. Please use the link from your email.';
  document.getElementById('errorMsg').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
}
</script>
</body>
</html>
